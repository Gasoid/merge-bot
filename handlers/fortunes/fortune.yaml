  - My AI assistant is very supportive, mostly because it doesn't understand what I'm asking
  - SQL taught me that the only reasonable answer to any question is JOIN
  - I asked the database for one row, it gave me a million, we don't talk about it
  - NULL is not zero, NULL is not false, NULL is just NULL's way of saying "figure it out yourself"
  - I wrote a query without a WHERE clause once, and now I have trust issues
  - Normalization is great until you need to actually query something
  - My database has foreign keys, my relationships do not
  - I ran DELETE without WHERE, and that's how I learned about backups
  - Indexes make queries faster, they do nothing for my self-esteem
