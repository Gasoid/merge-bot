  - "Rancher UI: because clicking through menus is cheaper than therapy"
  - I love C#. It lets me throw a NullReferenceException with enterprise-level elegance.
  - I used async/await everywhere in my .NET app. Now I can wait for my deadlocks asynchronously.
  - Configured connection pooling in .NET. Now my app can exhaust the database limits much faster.
  - LINQ is amazing. It allows me to write a beautiful one-liner that takes 45 minutes to execute in SQL.
